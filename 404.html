<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Ziwo Version Manifest</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04121d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2304121d'/%3E%3Ctext x='16' y='21.5' font-family='monospace' font-size='13' fill='%232dd9b8' text-anchor='middle'%3E%7Bv%7D%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #04121d; --panel: #081e30; --line: rgba(146, 196, 233, 0.13);
      --text: #d9e8f2; --muted: #8ba7bc; --faint: #5f7a8e;
      --teal: #2dd9b8; --amber: #f0b45f;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: var(--sans); background: var(--bg);
      background-image: radial-gradient(ellipse 70% 45% at 50% -12%, rgba(240, 180, 95, 0.06), transparent);
      color: var(--text); line-height: 1.55; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 4px; }
    .container { text-align: center; padding: 2rem; max-width: 34rem; }
    .logo { margin-bottom: 2.2rem; }
    .logo img { height: 34px; }
    .status { font-family: var(--mono); font-size: clamp(3.2rem, 12vw, 4.5rem); margin: 0; color: var(--amber); letter-spacing: 0.04em; }
    .status .slash { color: var(--faint); }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0.4rem 0 0.6rem; }
    p { color: var(--muted); font-size: 0.95rem; margin: 0 0 1.6rem; }
    .endpoints {
      display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
      margin-bottom: 1.8rem;
    }
    .endpoints a {
      font-family: var(--mono); font-size: 0.8rem;
      background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
      padding: 0.35rem 0.7rem;
    }
    .home { font-size: 0.92rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="https://www.ziwo.io/assets/footer/english-logo.svg" alt="Ziwo" onerror="this.hidden=true">
    </div>
    <p class="status"><span class="slash">//</span> 404</p>
    <h1>No endpoint at this path</h1>
    <p>The manifest serves these endpoints:</p>
    <nav class="endpoints" aria-label="Available endpoints">
      <a href="/all.json">/all.json</a>
      <a href="/all.xml">/all.xml</a>
      <a href="/meta.json">/meta.json</a>
    </nav>
    <p class="home"><a href="/">Browse all apps and endpoints →</a></p>
  </div>
</body>
</html>
